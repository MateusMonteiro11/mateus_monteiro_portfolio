<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b5bd6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Solid background without rounded corners -->
  <rect width="1280" height="720" fill="#0d0d0d"/>

  <!-- 
    Logo group centered at 640, 360.
    Scaling up the elements from the 512x512 version.
    Original center was 256,256. Scaling factor roughly 1.4x to 2x.
  -->
  <g transform="translate(640, 360) scale(1.8) translate(-256, -256)">
    <!-- Left chevron < -->
    <polyline points="172,206 134,256 172,306"
      fill="none"
      stroke="url(#chevronGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Letter M -->
    <text
      x="246"
      y="259"
      font-family="'Courier New', Courier, monospace"
      font-size="180"
      font-weight="600"
      fill="#ffffff"
      text-anchor="middle"
      dominant-baseline="middle">M</text>

    <!-- Slash / -->
    <line x1="328" y1="206" x2="298" y2="306"
      stroke="url(#chevronGrad)"
      stroke-width="26"
      stroke-linecap="round"/>

    <!-- Right chevron > -->
    <polyline points="350,206 388,256 350,306"
      fill="none"
      stroke="url(#chevronGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
