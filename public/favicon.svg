<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b5bd6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="88" ry="88" fill="#0d0d0d"/>

  <!--
    Layout plan (total symbol width ~380px, centered at 256):
    Left edge at x=68, right edge at x=448
    < : apex at x=80, arms from x=116
    M : center at x=256 (text-anchor middle)
    / : from (348,196) to (314,316)
    > : apex at x=432, arms from x=396
  -->

  <!-- Left chevron < -->
  <polyline points="116,196 68,256 116,316"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Letter M -->
  <text
    x="256"
    y="256"
    font-family="'Courier New', Courier, monospace"
    font-size="190"
    font-weight="600"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle">M</text>

  <!-- Slash / -->
  <line x1="352" y1="196" x2="316" y2="316"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"/>

  <!-- Right chevron > -->
  <polyline points="396,196 444,256 396,316"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
