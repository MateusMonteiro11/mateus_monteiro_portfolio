<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b5bd6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="88" ry="88" fill="#0d0d0d"/>

  <!-- Left chevron < -->
  <polyline points="156,206 118,256 156,306"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Letter M (subtle vertical shift to y=259) -->
  <text
    x="242"
    y="259"
    font-family="'Courier New', Courier, monospace"
    font-size="180"
    font-weight="600"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle">M</text>

  <!-- Slash / -->
  <line x1="338" y1="206" x2="308" y2="306"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"/>

  <!-- Right chevron > -->
  <polyline points="368,206 406,256 368,306"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
